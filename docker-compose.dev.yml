services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src
    command: ["node_modules/.bin/nodemon", "src/server.js"]

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]
    networks:
      - hero-network
